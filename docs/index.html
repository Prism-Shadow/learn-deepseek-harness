<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Learn DeepSeek Harness</title>
<!-- 两套 highlight.js 主题：暗色默认启用，亮色默认禁用；切换主题时互换 -->
<link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
<link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" disabled />
<link rel="stylesheet" href="./styles.css" />
<script>
  // 尽早应用主题，避免首屏闪烁
  ;(function () {
    var t = localStorage.getItem("ldh-theme") || "dark"
    document.documentElement.dataset.theme = t
    var dark = document.getElementById("hljs-dark")
    var light = document.getElementById("hljs-light")
    if (dark) dark.disabled = t !== "dark"
    if (light) light.disabled = t !== "light"
  })()
</script>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button id="menu-btn" class="menu-btn" aria-label="打开目录">☰</button>
    <span class="topbar-title">Learn DeepSeek Harness</span>
  </div>
  <div id="overlay" class="overlay"></div>
  <nav class="sidebar">
    <div class="brand">Learn DeepSeek Harness<small id="brand-sub"></small></div>
    <div class="controls">
      <button id="lang-btn" class="ctrl-btn" title="切换语言 / Toggle language"></button>
      <button id="theme-btn" class="ctrl-btn" title="切换主题 / Toggle theme"></button>
    </div>
    <div class="nav-section" id="sec-lessons"></div>
    <ul id="lesson-list"></ul>
    <div class="nav-section" id="sec-tools"></div>
    <ul>
      <li><a id="nav-diff" href="#diff"></a></li>
    </ul>
    <div class="repo-link">
      <a id="repo-link" href="https://github.com/Prism-Shadow/learn-deepseek-harness" target="_blank" rel="noopener"></a>
    </div>
  </nav>
  <main id="main"></main>
</div>

<!-- 纯静态 + CDN 库：marked(渲染 README) / highlight.js(代码高亮) / jsdiff(代码对比) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/diff@5/dist/diff.min.js"></script>
<script src="./app.js" defer></script>
</body>
</html>
